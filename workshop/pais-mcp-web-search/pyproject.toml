[project]
name = "pais-mcp-web-search"
version = "0.1.0"
description = "MCP server (Streamable HTTP) exposing Google and DuckDuckGo web search plus page-content fetching"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "ddgs>=9.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
pais-mcp-web-search = "pais_mcp_web_search.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pais_mcp_web_search"]
