[project]
name = "vcf-ops-logs-mcp"
version = "0.1.0"
description = "MCP server (Streamable HTTP) for VMware Cloud Foundation (VCF) Operations for Logs, with a background error-monitoring loop"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
vcf-ops-logs-mcp = "vcf_ops_logs_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcf_ops_logs_mcp"]
