services:
  open-webui:
    container_name: open-webui
    image: ${OWUI_IMAGE}
    volumes:
      - /opt/data/open-webui:/app/backend/data
      - /opt/data/docs:/data/docs
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - ENABLE_OLLAMA_API=False
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    env_file:
      - .env
volumes:
  webui_data:
