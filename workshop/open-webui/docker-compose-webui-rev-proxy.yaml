services:
  open-webui:
    container_name: open-webui
    image: ${OWUI_IMAGE}
    volumes:
      - /opt/data/open-webui:/app/backend/data
      - /opt/data/docs:/data/docs
      - /opt/data/open-webui/certs/oidc-ca-chain.crt:/etc/ssl/certs/oidc-ca-chain.crt:ro
    environment:
      - ENABLE_OLLAMA_API=False
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    env_file:
      - .env
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - /opt/data/open-webui/certs/cert.crt:/etc/nginx/ssl/cert.crt
      - /opt/data/open-webui/certs/cert.key:/etc/nginx/ssl/cert.key
      - /opt/data/open-webui/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
    - open-webui
volumes:
  webui_data:
