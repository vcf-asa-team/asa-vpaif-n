server {
    listen 443 ssl;
    server_name localhost; # Change this to your actual domain if not using localhost

    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3; # Removed older, insecure TLS 1.0/1.1
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://open-webui:8080;
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL for LLM Streaming
        proxy_buffering off;
        proxy_cache off; 
        proxy_http_version 1.1;
        
        # CRITICAL for WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long LLM generations
        send_timeout 300s;
        client_body_timeout 300s;
        keepalive_timeout 300s;

        # File Upload Settings
        client_max_body_size 100M;
        client_body_buffer_size 1M; # Increased from 10k for better performance
    }
}