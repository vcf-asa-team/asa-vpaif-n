# nginx.conf — reverse proxy for LibreChat
#
# Assumes LibreChat is reachable at the Docker Compose service name
# "librechat" on port 3080. Adjust `server_name`, the upstream address, and
# the TLS block for your setup.

# LibreChat streams chat responses and uses websockets — allow long-lived
# connections and large request bodies (file/image uploads).
client_max_body_size 100M;
client_body_buffer_size 1M; # Increased from 10k for better performance
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

upstream librechat {
    server librechat:3080;
}

# Redirect all plain HTTP traffic to HTTPS.
server {
    listen 80;
    server_name your-domain.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localhost; # Change this to your actual domain if not using localhost

    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://librechat;
        proxy_http_version 1.1;

        # Websocket upgrade support (required for streaming responses)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }
}
