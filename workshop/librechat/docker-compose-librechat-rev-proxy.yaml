services:
  librechat:
    container_name: LibreChat
    image: ${LIBRECHAT_IMAGE}
    restart: unless-stopped
    depends_on:
      - mongodb
      - rag_api
      - meilisearch
    volumes:
      - /opt/data/librechat/images:/app/client/public/images
      - /opt/data/librechat/uploads:/app/uploads
      - /opt/data/librechat/logs:/app/api/logs
      - /opt/data/librechat/librechat.yaml:/app/librechat.yaml
      - /opt/data/librechat/certs/oidc-ca-chain.crt:/etc/ssl/certs/oidc-ca-chain.crt:ro
    env_file:
      - .env
    extra_hosts:
      - host.docker.internal:host-gateway
  mongodb:
    container_name: chat-mongodb
    image: ${MONGO_IMAGE}
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - /opt/data/librechat/mongodb:/data/db
  meilisearch:
    container_name: chat-meilisearch
    image: ${MEILI_IMAGE}
    restart: unless-stopped
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - /opt/data/librechat/meili:/meili_data
  rag_api:
    container_name: librechat-rag-api
    image: ${RAG_API_IMAGE}
    restart: unless-stopped
    environment:
      - DB_HOST=${RAG_DB_HOST}
      - DB_PORT=${RAG_DB_PORT}
      - POSTGRES_DB=${RAG_POSTGRES_DB}
      - POSTGRES_USER=${RAG_POSTGRES_USER}
      - POSTGRES_PASSWORD=${RAG_POSTGRES_PASSWORD}
      - RAG_PORT=8000
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - /opt/data/librechat/certs/cert.crt:/etc/nginx/ssl/cert.crt
      - /opt/data/librechat/certs/cert.key:/etc/nginx/ssl/cert.key
      - /opt/data/librechat/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - librechat
